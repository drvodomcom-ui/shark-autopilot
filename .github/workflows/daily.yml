name: Shark Mindset Autopilot

on:
  schedule:
    # GitHub koristi UTC. Zimi je Beograd UTC+1, leti UTC+2 (tada sve ide sat kasnije).
    # Jedno pokretanje za svaki termin objave (6 običnih + 10 vesti)
    - cron: '2 6 * * *'   # 07:00 Beograd (zimsko vreme)
    - cron: '2 7 * * *'   # 08:00 Beograd (zimsko vreme)
    - cron: '2 8 * * *'   # 09:00 Beograd (zimsko vreme)
    - cron: '2 9 * * *'   # 10:00 Beograd (zimsko vreme)
    - cron: '32 10 * * *'   # 11:30 Beograd (zimsko vreme)
    - cron: '2 11 * * *'   # 12:00 Beograd (zimsko vreme)
    - cron: '2 12 * * *'   # 13:00 Beograd (zimsko vreme)
    - cron: '32 13 * * *'   # 14:30 Beograd (zimsko vreme)
    - cron: '32 14 * * *'   # 15:30 Beograd (zimsko vreme)
    - cron: '32 15 * * *'   # 16:30 Beograd (zimsko vreme)
    - cron: '2 16 * * *'   # 17:00 Beograd (zimsko vreme)
    - cron: '2 17 * * *'   # 18:00 Beograd (zimsko vreme)
    - cron: '2 18 * * *'   # 19:00 Beograd (zimsko vreme)
    - cron: '2 19 * * *'   # 20:00 Beograd (zimsko vreme)
    - cron: '2 20 * * *'   # 21:00 Beograd (zimsko vreme)
    - cron: '2 21 * * *'   # 22:00 Beograd (zimsko vreme)
