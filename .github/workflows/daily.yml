name: Shark Mindset Autopilot

on:
  schedule:
    # GitHub često preskače zakazana pokretanja. Zato svako pokretanje radi 50 minuta
    # i na svakih 5 minuta proverava termine; sledeće čeka u redu (concurrency).
    # Pokretanja: 06:07–22:52 po Beogradu (zimsko vreme). Duplih objava nema.
    - cron: '7,22,37,52 5-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shark-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke
        run: pip install -r requirements.txt

      - name: Autopilot (radi 50 minuta, proverava na svakih 5 minuta)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
        run: |
          git config user.name "shark-autopilot"
          git config user.email "actions@users.noreply.github.com"
          FAIL=0
          END=$((SECONDS + 3000))
          while true; do
            git pull -q --rebase origin master || true
            python main.py generate || { echo "::warning::generate nije uspeo"; }
            git add posts queue.json history.json
            git commit -qm "Nove objave $(date -u +'%Y-%m-%d %H:%M')" && git push -q || true
            python main.py publish || { echo "::error::publish nije uspeo"; FAIL=1; }
            python main.py schedule || { echo "::warning::schedule nije uspeo"; }
            git add queue.json
            git commit -qm "Status $(date -u +'%Y-%m-%d %H:%M')" && git push -q || true
            [ $SECONDS -ge $END ] && break
            sleep 300
          done
          exit $FAIL
